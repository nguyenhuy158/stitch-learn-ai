name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck (pnpm check), unit test, build; E2E rieng: build FE, D1 local moi,
  # `wrangler dev --local` (khong can token Cloudflare).
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-test: true
      run-build: true
      run-e2e: true
