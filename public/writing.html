<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sửa lỗi viết</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --teal-dark: #0f3d38;
      --teal: #0f766e;
      --orange: #f2792e;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #14201e;
      --muted: #6b7a78;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: var(--teal-dark);
      color: #fff;
      padding: 20px 20px 24px;
      border-radius: 0 0 24px 24px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
    header p { margin: 0; color: rgba(255, 255, 255, 0.75); font-size: 14px; }
    main { padding: 20px; }
    textarea {
      width: 100%;
      min-height: 140px;
      border-radius: 16px;
      border: 1px solid #e2e6e5;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
      background: var(--card);
      color: var(--text);
    }
    textarea:focus { outline: 2px solid var(--teal); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: right; }
    button.submit {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--teal-dark);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button.submit:disabled { opacity: 0.5; cursor: default; }
    .state { text-align: center; color: var(--muted); padding: 20px; font-size: 14px; }
    .state.error { color: #c0392b; }
    .result { margin-top: 24px; display: none; }
    .result.visible { display: block; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--teal-dark); text-transform: uppercase; margin: 20px 0 8px; }
    .corrected-box {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 15px;
      line-height: 1.5;
      box-shadow: 0 1px 3px rgba(15, 61, 56, 0.08);
    }
    .feedback-box {
      background: #fff7ec;
      border-left: 3px solid var(--orange);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
    }
    .correction-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(15, 61, 56, 0.06);
    }
    .correction-row { display: flex; gap: 8px; align-items: baseline; font-size: 14px; margin-bottom: 4px; }
    .correction-original { color: #c0392b; text-decoration: line-through; }
    .correction-suggestion { color: var(--teal); font-weight: 700; }
    .correction-explanation { font-size: 13px; color: var(--muted); }
    .no-corrections { text-align: center; color: var(--teal); font-weight: 600; padding: 16px; }

    @media (min-width: 768px) {
      .page { max-width: 900px; padding-bottom: 60px; }
      header { padding: 32px 40px; border-radius: 0 0 32px 32px; }
      header h1 { font-size: 28px; }
      main { padding: 32px 40px; }
      .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
      .result { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back-link" href="/lessons">&larr; Quay lại danh sách</a>
      <h1>Sửa lỗi viết</h1>
      <p>Viết đoạn văn tiếng Anh, Gemini sẽ sửa lỗi và giải thích.</p>
    </header>
    <main>
      <div class="layout">
        <div>
          <textarea id="input" maxlength="2000" placeholder="Nhập đoạn văn tiếng Anh của bạn ở đây..."></textarea>
          <div class="hint"><span id="charCount">0</span>/2000</div>
          <button class="submit" id="submitBtn">Kiểm tra & Sửa lỗi</button>
          <div id="state" class="state" style="display:none"></div>
        </div>
        <div id="result" class="result">
          <div class="section-title">Bản đã sửa</div>
          <div class="corrected-box" id="correctedBox"></div>
          <div class="section-title">Nhận xét chung</div>
          <div class="feedback-box" id="feedbackBox"></div>
          <div class="section-title">Chi tiết sửa lỗi</div>
          <div id="correctionsList"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const input = document.getElementById("input");
    const charCount = document.getElementById("charCount");
    const submitBtn = document.getElementById("submitBtn");
    const stateEl = document.getElementById("state");
    const resultEl = document.getElementById("result");
    const correctedBox = document.getElementById("correctedBox");
    const feedbackBox = document.getElementById("feedbackBox");
    const correctionsList = document.getElementById("correctionsList");

    input.addEventListener("input", () => {
      charCount.textContent = input.value.length;
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function renderResult(data) {
      correctedBox.textContent = data.corrected;
      feedbackBox.textContent = data.overallFeedback;
      if (!data.corrections.length) {
        correctionsList.innerHTML = '<div class="no-corrections">Không tìm thấy lỗi nào. Viết tốt lắm!</div>';
      } else {
        correctionsList.innerHTML = data.corrections
          .map(
            (c) => `
          <div class="correction-card">
            <div class="correction-row">
              <span class="correction-original">${escapeHtml(c.original)}</span>
              <span>&rarr;</span>
              <span class="correction-suggestion">${escapeHtml(c.suggestion)}</span>
            </div>
            <div class="correction-explanation">${escapeHtml(c.explanation)}</div>
          </div>`
          )
          .join("");
      }
      resultEl.classList.add("visible");
    }

    submitBtn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (!text) {
        stateEl.style.display = "";
        stateEl.className = "state error";
        stateEl.textContent = "Vui lòng nhập đoạn văn cần sửa.";
        return;
      }
      submitBtn.disabled = true;
      stateEl.style.display = "";
      stateEl.className = "state";
      stateEl.textContent = "Đang kiểm tra...";
      resultEl.classList.remove("visible");
      try {
        const res = await fetch("/api/writing/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        if (res.status === 401) {
          location.href = "/login";
          return;
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Không sửa được đoạn văn");
        stateEl.style.display = "none";
        renderResult(data);
      } catch (err) {
        stateEl.className = "state error";
        stateEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
