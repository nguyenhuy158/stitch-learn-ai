<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xếp hạng</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <script src="/assets/theme.js"></script>
  <style>
    :root { --teal-dark: #0f3d38; --teal: #0f766e; --orange: #f2792e; --bg: #f7f8fa; --card: #ffffff; --text: #14201e; --muted: #6b7a78; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Be Vietnam Pro", "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
    .page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
    header { background: var(--teal-dark); color: #fff; padding: 20px 20px 24px; border-radius: 0 0 24px 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; }
    main { padding: 20px; }
    .my-rank { background: var(--teal-dark); color: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; text-align: center; font-weight: 700; }
    .row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px 16px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(15,61,56,0.06); }
    .row.me { border: 2px solid var(--teal); }
    .rank-num { font-weight: 800; color: var(--teal-dark); width: 28px; text-align: center; }
    .row-name { flex: 1; font-weight: 600; }
    .row-streak { font-size: 12px; color: var(--muted); }
    .row-xp { font-weight: 700; color: var(--orange); }
    .state { text-align: center; color: var(--muted); padding: 60px 20px; }

    @media (min-width: 768px) {
      .page { max-width: 640px; padding-bottom: 60px; }
      header { padding: 28px 36px; border-radius: 0 0 32px 32px; }
      main { padding: 28px 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back-link" href="/">&larr; Về Home</a>
      <h1>Xếp hạng theo XP</h1>
    </header>
    <main>
      <div id="content" class="state">Đang tải...</div>
    </main>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    async function load() {
      const content = document.getElementById("content");
      try {
        const [meRes, rankRes] = await Promise.all([fetch("/api/auth/me"), fetch("/api/rankings")]);
        if (rankRes.status === 401) {
          location.href = "/login";
          return;
        }
        const me = await meRes.json();
        const { top, myRank } = await rankRes.json();
        const myId = me.user && me.user.id;

        const rowsHtml = top
          .map(
            (u, i) => `
          <div class="row ${u.id === myId ? "me" : ""}">
            <div class="rank-num">#${i + 1}</div>
            <div class="row-name">${escapeHtml(u.name || "Ẩn danh")}${u.id === myId ? " (Bạn)" : ""}<div class="row-streak">${u.streak || 0} ngày streak</div></div>
            <div class="row-xp">${u.xp || 0} XP</div>
          </div>`
          )
          .join("");

        const myRankHtml =
          myRank && !top.some((u) => u.id === myId)
            ? `<div class="my-rank">Hạng của bạn: #${myRank}</div>`
            : "";

        content.className = "";
        content.innerHTML = myRankHtml + rowsHtml;
      } catch (err) {
        content.className = "state";
        content.textContent = "Không tải được xếp hạng: " + err.message;
      }
    }

    load();
  </script>
</body>
</html>
