<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử học tập</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <script src="/assets/theme.js"></script>
  <style>
    :root {
      --teal-dark: #0f3d38;
      --teal: #0f766e;
      --orange: #f2792e;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #14201e;
      --muted: #6b7a78;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Be Vietnam Pro", "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
    .page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
    header {
      background: var(--teal-dark);
      color: #fff;
      padding: 20px 20px 24px;
      border-radius: 0 0 24px 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255, 255, 255, 0.85); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 16px;
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; }
    main { padding: 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 3px rgba(15, 61, 56, 0.08); }
    .stat-value { font-size: 20px; font-weight: 800; color: var(--teal-dark); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    .level-card {
      background: var(--teal-dark); color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 24px;
    }
    .level-card .top-row { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.7); }
    .level-card .level-name { font-size: 18px; font-weight: 700; margin: 2px 0 10px; }
    .level-bar-bg { background: rgba(255,255,255,0.2); border-radius: 6px; height: 8px; overflow: hidden; }
    .level-bar-fill { background: #fff; height: 100%; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 10px; }
    .day-group { margin-bottom: 20px; }
    .day-label { font-size: 13px; font-weight: 700; color: var(--teal-dark); margin-bottom: 8px; }
    .entry {
      background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 1px 3px rgba(15, 61, 56, 0.06);
    }
    .entry-icon {
      width: 36px; height: 36px; border-radius: 10px; background: #e5f3f1; color: var(--teal);
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .entry-body { flex: 1; min-width: 0; }
    .entry-title { font-size: 14px; font-weight: 700; }
    .entry-message { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-time { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .entry-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .badge-good { background: #e6f7ed; color: #1a7f4b; }
    .badge-fix { background: #fff1e0; color: var(--orange); }
    .state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

    @media (min-width: 768px) {
      .page { max-width: 720px; padding-bottom: 60px; }
      header { padding: 28px 36px 32px; border-radius: 0 0 32px 32px; }
      main { padding: 28px 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back-link" href="/">&larr; Về Home</a>
      <h1>Lịch sử học tập</h1>
    </header>
    <main>
      <div id="content" class="state">Đang tải...</div>
    </main>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function dayLabel(dateStr) {
      const d = new Date(dateStr.replace(" ", "T") + "Z");
      const today = new Date();
      const diffDays = Math.floor((today.setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
      if (diffDays === 0) return "Hôm nay";
      if (diffDays === 1) return "Hôm qua";
      return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function formatTime(dateStr) {
      const d = new Date(dateStr.replace(" ", "T") + "Z");
      return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    }

    function pairMessages(messages) {
      const pairs = [];
      for (let i = 0; i < messages.length; i++) {
        if (messages[i].role === "user") {
          const reply = messages[i + 1] && messages[i + 1].role === "model" ? messages[i + 1] : null;
          pairs.push({ user: messages[i], reply });
          if (reply) i++;
        }
      }
      return pairs;
    }

    function groupByDay(pairs) {
      const groups = new Map();
      for (const pair of pairs) {
        const key = dayLabel(pair.user.created_at);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(pair);
      }
      return groups;
    }

    function renderEntry(pair) {
      let metadata = null;
      try {
        metadata = pair.reply && pair.reply.metadata ? JSON.parse(pair.reply.metadata) : null;
      } catch {
        metadata = null;
      }
      const correctionCount = metadata && Array.isArray(metadata.corrections) ? metadata.corrections.length : 0;
      const badge = pair.reply
        ? correctionCount === 0
          ? '<span class="entry-badge badge-good">Không lỗi</span>'
          : `<span class="entry-badge badge-fix">${correctionCount} lỗi</span>`
        : "";
      return `
        <div class="entry">
          <div class="entry-icon">💬</div>
          <div class="entry-body">
            <div class="entry-title">Luyện nói AI</div>
            <div class="entry-message">${escapeHtml(pair.user.content)}</div>
            <div class="entry-time">${formatTime(pair.user.created_at)}</div>
          </div>
          ${badge}
        </div>`;
    }

    async function load() {
      const contentEl = document.getElementById("content");
      try {
        const [meRes, historyRes] = await Promise.all([fetch("/api/auth/me"), fetch("/api/chat/history")]);
        const me = await meRes.json();
        const history = await historyRes.json();
        if (!me.user) {
          location.href = "/login";
          return;
        }

        const pairs = pairMessages(Array.isArray(history) ? history : []);
        const groups = groupByDay(pairs);

        const statsHtml = `
          <div class="stats">
            <div class="stat-card"><div class="stat-value">${me.user.streak || 0}</div><div class="stat-label">Chuỗi ngày</div></div>
            <div class="stat-card"><div class="stat-value">${me.user.xp || 0}</div><div class="stat-label">Điểm XP</div></div>
            <div class="stat-card"><div class="stat-value">${pairs.length}</div><div class="stat-label">Lượt hội thoại</div></div>
          </div>
          <div class="level-card">
            <div class="top-row"><span>Trình độ hiện tại</span><span>${me.user.level_progress || 0}%</span></div>
            <div class="level-name">${escapeHtml(me.user.level || "B1")}</div>
            <div class="level-bar-bg"><div class="level-bar-fill" style="width:${me.user.level_progress || 0}%"></div></div>
          </div>`;

        if (groups.size === 0) {
          contentEl.innerHTML = statsHtml + '<div class="state">Chưa có hoạt động nào. Vào AI Chat để bắt đầu!</div>';
          return;
        }

        const dayGroupsHtml = [...groups.entries()]
          .reverse()
          .map(
            ([day, dayPairs]) => `
          <div class="day-group">
            <div class="day-label">${escapeHtml(day)}</div>
            ${dayPairs.reverse().map(renderEntry).join("")}
          </div>`
          )
          .join("");

        contentEl.innerHTML = statsHtml + dayGroupsHtml;
      } catch (err) {
        contentEl.textContent = "Không tải được lịch sử: " + err.message;
      }
    }

    load();
  </script>
</body>
</html>
