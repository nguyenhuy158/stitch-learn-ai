<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn lỗi sai</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root { --teal-dark: #0f3d38; --teal: #0f766e; --orange: #f2792e; --bg: #f7f8fa; --card: #ffffff; --text: #14201e; --muted: #6b7a78; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Be Vietnam Pro", "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
    .page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
    header { background: var(--teal-dark); color: #fff; padding: 20px 20px 24px; border-radius: 0 0 24px 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; }
    header p { margin: 4px 0 0; color: rgba(255,255,255,0.75); font-size: 14px; }
    main { padding: 20px; }
    .mistake-card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(15,61,56,0.06); }
    .mistake-row { display: flex; gap: 8px; align-items: baseline; font-size: 15px; margin-bottom: 4px; flex-wrap: wrap; }
    .mistake-original { color: #c0392b; text-decoration: line-through; }
    .mistake-suggestion { color: var(--teal); font-weight: 700; }
    .mistake-explanation { font-size: 13px; color: var(--muted); }
    .state { text-align: center; color: var(--muted); padding: 60px 20px; }

    @media (min-width: 768px) {
      .page { max-width: 720px; padding-bottom: 60px; }
      header { padding: 28px 36px; border-radius: 0 0 32px 32px; }
      main { padding: 28px 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back-link" href="/">&larr; Về Home</a>
      <h1>Ôn lỗi sai</h1>
      <p>Tổng hợp các lỗi ngữ pháp Gemini đã sửa cho bạn trong AI Chat.</p>
    </header>
    <main>
      <div id="content" class="state">Đang tải...</div>
    </main>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    async function load() {
      const content = document.getElementById("content");
      try {
        const res = await fetch("/api/chat/history");
        if (res.status === 401) {
          location.href = "/login";
          return;
        }
        const messages = await res.json();
        const mistakes = [];
        const seen = new Set();
        for (const m of Array.isArray(messages) ? messages : []) {
          if (m.role !== "model" || !m.metadata) continue;
          let meta;
          try {
            meta = JSON.parse(m.metadata);
          } catch {
            continue;
          }
          for (const c of meta.corrections || []) {
            const text = typeof c === "string" ? c : `${c.original || ""} -> ${c.suggestion || ""}`;
            if (seen.has(text)) continue;
            seen.add(text);
            mistakes.push(c);
          }
        }

        if (!mistakes.length) {
          content.className = "state";
          content.textContent = "Chưa có lỗi nào được ghi nhận. Cứ chat với AI Tutor, lỗi sẽ hiện ở đây.";
          return;
        }

        content.className = "";
        content.innerHTML = mistakes
          .slice(0, 30)
          .map((c) =>
            typeof c === "string"
              ? `<div class="mistake-card"><div class="mistake-row">${escapeHtml(c)}</div></div>`
              : `<div class="mistake-card">
                  <div class="mistake-row">
                    ${c.original ? `<span class="mistake-original">${escapeHtml(c.original)}</span>` : ""}
                    ${c.original && c.suggestion ? "<span>&rarr;</span>" : ""}
                    ${c.suggestion ? `<span class="mistake-suggestion">${escapeHtml(c.suggestion)}</span>` : ""}
                  </div>
                  ${c.explanation ? `<div class="mistake-explanation">${escapeHtml(c.explanation)}</div>` : ""}
                </div>`
          )
          .join("");
      } catch (err) {
        content.className = "state";
        content.textContent = "Không tải được: " + err.message;
      }
    }

    load();
  </script>
</body>
</html>
