<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết bài học</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --teal-dark: #0f3d38;
      --teal: #0f766e;
      --orange: #f2792e;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #14201e;
      --muted: #6b7a78;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      padding-bottom: 40px;
    }
    header {
      background: var(--teal-dark);
      color: #fff;
      padding: 20px 20px 28px;
      border-radius: 0 0 24px 24px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 800;
    }
    header p {
      margin: 0;
      color: rgba(255, 255, 255, 0.75);
      font-size: 15px;
    }
    main {
      padding: 20px;
    }
    .state {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }
    .state.error { color: #c0392b; }
    .vocab-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vocab-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 1px 3px rgba(15, 61, 56, 0.08);
    }
    .vocab-term {
      font-size: 18px;
      font-weight: 700;
      color: var(--teal-dark);
    }
    .vocab-meaning {
      font-size: 14px;
      color: var(--orange);
      font-weight: 600;
      margin-top: 2px;
    }
    .vocab-example {
      font-size: 14px;
      color: var(--muted);
      margin-top: 8px;
      font-style: italic;
      line-height: 1.4;
    }

    /* Desktop / wider viewports: multi-column grid, page no longer phone-width */
    @media (min-width: 768px) {
      .page {
        max-width: 960px;
        padding-bottom: 60px;
      }
      header {
        padding: 32px 40px 40px;
        border-radius: 0 0 32px 32px;
      }
      header h1 { font-size: 32px; }
      header p { font-size: 16px; }
      main { padding: 32px 40px; }
      .vocab-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .vocab-card { padding: 20px 22px; }
    }
    @media (min-width: 1100px) {
      .vocab-list { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back-link" href="/lessons">&larr; Quay lại danh sách</a>
      <h1 id="lesson-title">Đang tải...</h1>
      <p id="lesson-subtitle"></p>
    </header>
    <main>
      <div id="content" class="state">Đang tải bài học...</div>
    </main>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    const contentEl = document.getElementById("content");
    const titleEl = document.getElementById("lesson-title");
    const subtitleEl = document.getElementById("lesson-subtitle");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function renderVocab(vocab) {
      if (!vocab.length) {
        contentEl.className = "state";
        contentEl.textContent = "Bài học này chưa có nội dung.";
        return;
      }
      contentEl.className = "";
      contentEl.innerHTML = `<div class="vocab-list">${vocab
        .map(
          (item) => `
        <div class="vocab-card">
          <div class="vocab-term">${escapeHtml(item.term)}</div>
          <div class="vocab-meaning">${escapeHtml(item.meaning)}</div>
          ${item.example ? `<div class="vocab-example">"${escapeHtml(item.example)}"</div>` : ""}
        </div>`
        )
        .join("")}</div>`;
    }

    async function load() {
      if (!id) {
        contentEl.className = "state error";
        contentEl.textContent = "Thiếu id bài học.";
        return;
      }
      try {
        const res = await fetch(`/api/lessons/${id}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Không tải được bài học");
        titleEl.textContent = data.lesson.title;
        subtitleEl.textContent = data.lesson.sub_title || "";
        renderVocab(data.vocab);
      } catch (err) {
        contentEl.className = "state error";
        contentEl.textContent = err.message;
      }
    }

    load();
  </script>
</body>
</html>
