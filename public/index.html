<!doctype html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học Tiếng Anh cùng Gemini</title>
  <script src="/assets/theme.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Dh9l9Bsl.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-TOnAb83y.css">
  <style>
    /*
      Swaps the compiled bundle's hardcoded Manrope for Be Vietnam Pro
      everywhere. The bundle's CSS bakes `font-family:Manrope,sans-serif`
      into a utility class (verified in index-TOnAb83y.css) — no source to
      change that at the root, so this overrides it globally instead.
    */
    *, body {
      font-family: "Be Vietnam Pro", "Noto Sans", sans-serif !important;
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined" !important;
    }
    /*
      The floating "AI Chat" button centered above the bottom nav is a
      purple/indigo rounded-square in the compiled bundle — clashes with the
      rest of the app's teal/orange palette. Scoped to its exact (unique)
      combination of utility classes, verified via devtools. Circle shape +
      teal gradient matching the header/streak color instead.
    */
    button.bg-gradient-to-br.from-indigo-500.via-indigo-600.to-purple-600 {
      border-radius: 50% !important;
      background: linear-gradient(135deg, #14b8a6, #0f3d38) !important;
      box-shadow: 0 8px 20px rgba(15, 61, 56, 0.35) !important;
    }
    /*
      The compiled bundle hard-codes a phone-frame mockup: a single
      `.max-w-md` wrapper (448px, plus a decorative border+shadow) that the
      whole app and its bottom nav are centered inside, regardless of
      viewport. There's no source to edit that constraint properly, so this
      widens it responsively on larger screens instead. Scoped to `.max-w-md`
      specifically because it's used for exactly these two layout anchors in
      this app (verified via devtools), not for cards/buttons elsewhere.
    */
    @media (min-width: 768px) {
      .max-w-md {
        max-width: 720px !important;
      }
      div.max-w-md.border-x {
        border: none !important;
        box-shadow: none !important;
      }
    }
    @media (min-width: 1200px) {
      .max-w-md {
        max-width: 880px !important;
      }
    }

    /*
      Desktop sidebar. The bottom tab bar is a compiled component we can't
      edit — its outer wrapper happens to have this exact combination of
      utility classes (verified via devtools), which is unique to it, so
      it's used as the hide target instead of a class we'd have to add
      ourselves. #app-sidebar below is a plain injected element (see script
      at the bottom of <body>), not part of the React tree; it does full
      page navigations (<a href>), not client-side routing, since there's no
      access to the bundle's router internals to hook into.
    */
    #app-sidebar { display: none; }
    @media (min-width: 1024px) {
      .fixed.bottom-0.left-0.right-0.z-50 { display: none !important; }
      body { padding-left: 240px; }
      #app-sidebar {
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 240px;
        padding: 24px 12px;
        background: #0f3d38;
        box-sizing: border-box;
      }
      #app-sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: none;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 600;
        font-size: 14px;
      }
      #app-sidebar a:hover { background: rgba(255, 255, 255, 0.08); }
      #app-sidebar a.active { background: rgba(255, 255, 255, 0.14); color: #fff; }
      #app-sidebar a .material-symbols-outlined { font-size: 20px; }
      #app-sidebar .sidebar-title {
        color: #fff;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 800;
        font-size: 16px;
        padding: 8px 14px 20px;
      }
    }

    /*
      Ocean/Sunset re-theme: the bundle's brand teal/orange is baked into
      hardcoded hex utility classes (e.g. bg-[#195c5a]) with no source to
      edit, so there's no way to swap them for real alternate palettes.
      A CSS hue-rotate filter on the React root approximates it instead —
      grayscale/white/black stay put (hue-rotate doesn't touch achromatic
      colors), only the brand hues shift. "Dark" doesn't need this: the
      bundle already ships ~160 unused Tailwind `dark:` rules, so theme.js
      just toggles the `dark` class for a real dark mode there.
    */
    [data-theme="ocean"] #root { filter: hue-rotate(30deg) saturate(1.05); }
    [data-theme="sunset"] #root { filter: hue-rotate(200deg) saturate(1.1); }

    /*
      Theme picker menu — anchored under the "Giao diện" row in Hồ sơ >
      Cài đặt & Tùy chọn (injected by the script at the end of <body>), not
      a floating button on every screen. Position is set inline per-open
      from the row's bounding rect; only the visual chrome lives here.
    */
    #app-theme-menu {
      position: fixed; z-index: 9999;
      background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      padding: 8px; display: none; flex-direction: column; gap: 2px; min-width: 150px;
    }
    #app-theme-menu.open { display: flex; }
    #app-theme-menu button {
      display: flex; align-items: center; gap: 10px; border: none; background: transparent;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-family: "Be Vietnam Pro", sans-serif;
      font-size: 13px; font-weight: 600; color: #14201e; text-align: left;
    }
    #app-theme-menu button:hover { background: rgba(127,127,127,0.12); }
    #app-theme-menu .swatch { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
    [data-theme="dark"] #app-theme-menu { background: #1b2320; }
    [data-theme="dark"] #app-theme-menu button { color: #e8f0ee; }
  </style>
</head>

<body>
  <nav id="app-sidebar">
    <div class="sidebar-title">Học Tiếng Anh cùng Gemini</div>
    <a href="/" data-path="/"><span class="material-symbols-outlined">home</span>Trang chủ</a>
    <a href="/lessons" data-path="/lessons"><span class="material-symbols-outlined">book_2</span>Học</a>
    <a href="/chat" data-path="/chat"><span class="material-symbols-outlined">smart_toy</span>AI Chat</a>
    <a href="/history" data-path="/history"><span class="material-symbols-outlined">history</span>Lịch sử</a>
    <a href="/profile" data-path="/profile"><span class="material-symbols-outlined">person</span>Hồ sơ</a>
  </nav>
  <div id="root"></div>
  <script>
    document.querySelectorAll("#app-sidebar a[data-path]").forEach((link) => {
      if (link.dataset.path === location.pathname) link.classList.add("active");
    });

    /*
      The lesson list/cards render from real data but have no click handler
      at all in the compiled bundle (verified via devtools — clicking does
      nothing, not even a failed navigation). No source to add one, so this
      patches it in from outside: fetch the real lesson list once, then map
      clicks to lesson.html by matching text ("Tiếp tục" button -> whichever
      lesson is_active) or DOM position (each row under the "Lộ trình cơ bản"
      heading, in the same order /api/lessons returns them in).
    */
    (function () {
      const lessonsPromise = fetch("/api/lessons").then((r) => r.json()).catch(() => []);

      function roadmapRows() {
        const heading = [...document.querySelectorAll("*")].find(
          (el) => el.children.length === 0 && el.textContent.trim() === "Lộ trình cơ bản"
        );
        if (!heading) return [];
        const wrapper = [...heading.parentElement.children].find((c) => c !== heading);
        return wrapper ? [...wrapper.children] : [];
      }

      document.addEventListener(
        "click",
        async function (e) {
          const continueBtn = e.target.closest("button");
          // Text is actually "Tiếp tục" + an icon glyph name glued on with no
          // separator (e.g. "Tiếp tụcarrow_forward") — startsWith, not ===.
          if (continueBtn && continueBtn.textContent.trim().startsWith("Tiếp tục")) {
            const lessons = await lessonsPromise;
            const target = lessons.find((l) => l.is_active) || lessons[0];
            if (target) location.href = `/lesson.html?id=${target.id}`;
            return;
          }

          const rows = roadmapRows();
          const idx = rows.findIndex((r) => r === e.target || r.contains(e.target));
          if (idx !== -1) {
            const lessons = await lessonsPromise;
            const lesson = lessons[idx];
            if (lesson && !lesson.is_locked) location.href = `/lesson.html?id=${lesson.id}`;
            return;
          }

          // "Sửa lỗi viết" suggestion card: same situation, no handler at
          // all. Genuinely no route existed for it anywhere (checked the
          // bundle), so writing.html + /api/writing/review were built fresh
          // rather than patched from existing data like the lesson pages.
          const writingCard = [...document.querySelectorAll("*")].find(
            (el) => el.children.length === 0 && el.textContent.trim() === "Sửa lỗi viết"
          );
          if (writingCard && (e.target === writingCard || writingCard.contains(e.target) || e.target.contains(writingCard))) {
            location.href = "/writing.html";
            return;
          }

          // Bottom nav "Lịch sử" (mobile) does client-side SPA routing to its
          // own compiled mock history page — no network request, so the new
          // real history.html (served at the clean URL /history) never gets
          // a chance to load unless we force a full navigation here instead.
          const historyNavBtn = e.target.closest("button");
          if (historyNavBtn && historyNavBtn.textContent.trim().endsWith("Lịch sử")) {
            e.preventDefault();
            e.stopPropagation();
            location.href = "/history";
            return;
          }

          // "See all" next to "Continue Learning" on Home has no handler
          // either. That heading + this button are hardcoded English in the
          // bundle regardless of the language setting (unlike the rest of
          // the app, which is Vietnamese) — verified via devtools, not a
          // translation quirk. Only wired on "/" — the same-labelled button
          // next to "Gợi ý cho bạn" on /lessons already shows everything it
          // has (just 2 cards), so there's nothing meaningful to navigate to
          // there.
          if (location.pathname === "/") {
            const seeAllBtn = e.target.closest("button");
            if (seeAllBtn && seeAllBtn.textContent.trim() === "Xem tất cả") {
              location.href = "/lessons";
              return;
            }

            // "Gemini Suggests" (Pronunciation Fix / Mistake Review / Coffee
            // Chat) and "Learning Tools" (AI Tutor / Flashcards / Saved /
            // Rankings) — none of these had any handler in the compiled
            // bundle (verified via devtools). Mistake Review has real data
            // behind it (chat corrections) so it gets its own page; the
            // other two "Gemini Suggests" cards map to the existing AI Chat
            // feature since that's genuinely what practicing pronunciation
            // or a casual conversation means here — there's no separate
            // pronunciation-scoring or scenario-roleplay backend.
            const toolBtn = e.target.closest("button");
            if (toolBtn) {
              const toolText = toolBtn.textContent.trim();
              if (toolText.endsWith("Gia sư AI")) {
                location.href = "/chat";
                return;
              }
              if (toolText.endsWith("Thẻ ghi nhớ")) {
                location.href = "/flashcards.html";
                return;
              }
              if (toolText.endsWith("Đã lưu")) {
                location.href = "/saved.html";
                return;
              }
              if (toolText.endsWith("Xếp hạng")) {
                location.href = "/rankings.html";
                return;
              }
              if (toolText.startsWith("Bắt đầu")) {
                // Walk up and stop at the FIRST ancestor whose text mentions
                // any of the 3 cards, not just "Ôn lỗi sai" — the cards
                // share a container a few levels up, so scanning past that
                // point falsely matched it for every card.
                let ancestor = toolBtn.parentElement;
                let cardName = null;
                for (let depth = 0; depth < 6 && ancestor; depth++) {
                  const t = ancestor.textContent;
                  if (t.includes("Ôn lỗi sai")) { cardName = "mistake"; break; }
                  if (t.includes("Sửa lỗi phát âm")) { cardName = "other"; break; }
                  if (t.includes("Trò Chuyện Cà Phê")) { cardName = "other"; break; }
                  ancestor = ancestor.parentElement;
                }
                location.href = cardName === "mistake" ? "/mistakes.html" : "/chat";
                return;
              }
            }
          }

          if (location.pathname === "/profile") {
            const btn = e.target.closest("button");
            if (!btn) return;
            const text = btn.textContent.trim();

            // Gear icon in the header opens nothing at all (verified via
            // devtools — no modal, no navigation, completely inert). It
            // duplicates "Cài đặt & Tùy chọn" below anyway, so instead of
            // leaving it dead, scroll down to that section.
            if (text === "settings") {
              const settingsHeading = [...document.querySelectorAll("*")].find(
                (el) => el.children.length === 0 && el.textContent.trim() === "Cài đặt & Tùy chọn"
              );
              if (settingsHeading) settingsHeading.scrollIntoView({ behavior: "smooth", block: "start" });
              return;
            }

            // "Trợ giúp & Phản hồi" opens a modal that the bundle renders
            // completely empty (verified via devtools — the sheet slides up
            // with zero content inside). No source to fix that, so this
            // intercepts the click before React's own handler and goes to a
            // real page instead (FAQ + a feedback form wired to a new
            // /api/feedback endpoint).
            if (text.includes("Trợ giúp & Phản hồi")) {
              e.preventDefault();
              e.stopPropagation();
              location.href = "/help.html";
            }
          }
        },
        true
      );
    })();

    /*
      Category tabs on /lessons are decorative too: they never toggle active
      state or filter anything in the compiled bundle. Patched from outside
      like the click handler above.

      No real data to filter by — the `lessons` table has no category
      column, only title/subtitle/progress/lock flags — so "Ngữ pháp" and
      "AI Practice" show an honest empty state rather than a fake filter,
      since none of the 4 seed lessons are actually grammar drills or
      AI-practice content (those are separate cards/routes). "Từ vựng" shows
      everything, since every current lesson genuinely is a vocab topic.

      The search input next to these tabs was tried too (removing its
      hardcoded `readonly` + filtering on `input`), but React reverts both
      the attribute and the value on the native `input` event since it's a
      controlled input with no onChange handler — that's React's own
      behavior, not fixable by patching from outside. Left as decorative.
    */
    (function () {
      const lessonsPromise = fetch("/api/lessons").then((r) => r.json()).catch(() => []);

      function roadmapRows() {
        const heading = [...document.querySelectorAll("*")].find(
          (el) => el.children.length === 0 && el.textContent.trim() === "Lộ trình cơ bản"
        );
        if (!heading) return [];
        const wrapper = [...heading.parentElement.children].find((c) => c !== heading);
        return wrapper ? [...wrapper.children] : [];
      }

      const TAB_DEFS = [
        { match: "Tất cả", mode: "all" },
        { match: "Ngữ pháp", mode: "none" },
        { match: "Từ vựng", mode: "all" },
        { match: "Luyện tập AI", mode: "none" }
      ];
      const ACTIVE_CLASS =
        "flex items-center gap-2 px-5 py-2 bg-primary text-white rounded-full shadow-md shadow-primary/20 text-sm font-bold transition-all active:scale-95";
      let currentMode = "all";

      function findTabButton(def) {
        return [...document.querySelectorAll("button")].find((b) => b.textContent.includes(def.match));
      }

      function setActiveTab(selectedBtn) {
        TAB_DEFS.forEach((def) => {
          const btn = findTabButton(def);
          if (!btn) return;
          if (btn === selectedBtn) {
            if (!btn.dataset.originalClass) btn.dataset.originalClass = btn.className;
            btn.className = ACTIVE_CLASS;
          } else if (btn.dataset.originalClass) {
            btn.className = btn.dataset.originalClass;
          }
        });
      }

      function renderEmptyState(rows) {
        const wrapper = rows[0] && rows[0].parentElement;
        if (!wrapper) return;
        let el = document.getElementById("patched-empty-state");
        const visible = rows.some((r) => r.style.display !== "none");
        if (visible) {
          if (el) el.style.display = "none";
          return;
        }
        if (!el) {
          el = document.createElement("div");
          el.id = "patched-empty-state";
          el.style.padding = "24px 4px";
          el.style.textAlign = "center";
          el.style.color = "#6b7a78";
          el.style.fontFamily = "Be Vietnam Pro, sans-serif";
          el.style.fontSize = "14px";
          wrapper.appendChild(el);
        }
        el.textContent = "Chưa có bài học nào trong mục này.";
        el.style.display = "";
      }

      function applyFilter() {
        const rows = roadmapRows();
        if (!rows.length) return;
        rows.forEach((row) => {
          row.style.display = currentMode === "all" ? "" : "none";
        });
        renderEmptyState(rows);
      }

      document.addEventListener("click", function (e) {
        const hit = TAB_DEFS.map((def) => ({ def, btn: findTabButton(def) })).find(
          ({ btn }) => btn && (btn === e.target || btn.contains(e.target))
        );
        if (!hit) return;
        currentMode = hit.def.mode;
        setActiveTab(hit.btn);
        applyFilter();
      });
    })();

    /*
      Theme picker lives only in Hồ sơ > Cài đặt & Tùy chọn, as a row
      matching the existing ones (Ngôn ngữ, Giọng đọc & Phát âm, ...) — not
      a button floating over every screen.

      A previous version of this observed the whole document.body subtree
      and re-scanned every element on every single mutation anywhere in the
      SPA (typing, animations, even an unrelated browser extension's own
      DOM churn) — that's what actually froze the tab, not React fighting
      the extra node. This version bails out immediately unless the path is
      /profile (skips the vast majority of mutations before doing any DOM
      work) and debounces the rest, so it runs at most a few times a
      second no matter how chatty the page gets.
    */
    (function () {
      let debounceHandle = null;

      function findSettingsHeading() {
        // h3 tag match (verified via devtools) instead of scanning every
        // element — this section only exists on /profile, but keeping the
        // tag-scoped query cheap means the pathname check above is just a
        // cheap first filter, not the only thing standing between this and
        // an expensive full-DOM walk.
        return [...document.querySelectorAll("h3")].find((el) => el.textContent.trim() === "Cài đặt & Tùy chọn");
      }

      function updateValueLabel() {
        const value = document.getElementById("theme-settings-value");
        if (value) value.textContent = window.__APP_THEME_META__[window.getAppTheme()].label;
      }

      function ensureMenu() {
        let menu = document.getElementById("app-theme-menu");
        if (menu) return menu;
        menu = document.createElement("div");
        menu.id = "app-theme-menu";
        window.__APP_THEMES__.forEach((key) => {
          const meta = window.__APP_THEME_META__[key];
          const item = document.createElement("button");
          item.type = "button";
          item.innerHTML = `<span class="swatch" style="background:${meta.color}"></span><span>${meta.label}</span>`;
          item.addEventListener("click", () => {
            window.setAppTheme(key);
            updateValueLabel();
            menu.classList.remove("open");
          });
          menu.appendChild(item);
        });
        document.body.appendChild(menu);
        document.addEventListener("click", () => menu.classList.remove("open"));
        return menu;
      }

      function buildThemeRow() {
        const row = document.createElement("button");
        row.id = "theme-settings-row";
        row.type = "button";
        row.className =
          "flex w-full items-center justify-between rounded-3xl bg-white dark:bg-card-dark p-4 shadow-sm border border-gray-100 dark:border-gray-800 active:scale-[0.98] transition-all hover:border-primary/20";
        row.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gray-50 dark:bg-gray-800/50 text-gray-500">
              <span class="material-symbols-outlined text-[24px]">palette</span>
            </div>
            <div class="flex flex-col items-start">
              <span class="text-gray-900 dark:text-white font-black text-sm tracking-tight">Giao diện</span>
              <span id="theme-settings-value" class="text-[11px] font-bold text-gray-400 mt-0.5"></span>
            </div>
          </div>
          <span class="material-symbols-outlined text-gray-300">chevron_right</span>
        `;
        row.addEventListener("click", (e) => {
          e.stopPropagation();
          const menu = ensureMenu();
          const opening = !menu.classList.contains("open");
          if (opening) {
            const rect = row.getBoundingClientRect();
            menu.style.top = rect.bottom + 8 + "px";
            menu.style.left = Math.min(rect.left, window.innerWidth - 166) + "px";
          }
          menu.classList.toggle("open", opening);
        });
        return row;
      }

      function ensureRow() {
        if (location.pathname !== "/profile") return;
        const heading = findSettingsHeading();
        if (!heading) return;
        if (document.getElementById("theme-settings-row")) {
          updateValueLabel();
          return;
        }
        heading.insertAdjacentElement("afterend", buildThemeRow());
        updateValueLabel();
      }

      function scheduleEnsureRow() {
        if (location.pathname !== "/profile") return;
        clearTimeout(debounceHandle);
        debounceHandle = setTimeout(ensureRow, 200);
      }

      new MutationObserver(scheduleEnsureRow).observe(document.body, { childList: true, subtree: true });
      scheduleEnsureRow();
    })();

    /*
      Leftover English UI chrome the compiled bundle never localized —
      greeting, stat labels, "Gemini Suggests"/"Learning Tools" cards, the
      bottom-nav "Home" label, tab/badge/relative-time strings, and the
      Gemini AI config modal's voice/personality options are all hardcoded
      English regardless of the app's Vietnamese UI everywhere else
      (verified via devtools — not a language-setting issue, "Ngôn ngữ:
      English" is a separate, correct, user preference).

      This only rewrites text NODE values (never adds/removes elements),
      scoped to #root and debounced, so it can't fight React's
      reconciliation the way an earlier version of the settings-row patch
      above once did (see that commit's message) — worst case a rewritten
      node gets reset by a re-render and this quietly rewrites it again on
      the next debounced pass.

      The click-routing patches elsewhere in this file matched some of
      these strings by their old English text (toolText.endsWith("Saved"),
      TAB_DEFS, etc.) — those were updated to match the Vietnamese text
      below instead, not left pointing at strings that no longer exist.
    */
    (function () {
      const EXACT = {
        "Good Morning": "Chào buổi sáng",
        "Good Afternoon": "Chào buổi chiều",
        "Good Evening": "Chào buổi tối",
        "On Fire": "Đang cháy",
        "Day Streak": "ngày liên tiếp",
        "Practice every day to build your habit!": "Luyện tập mỗi ngày để xây dựng thói quen!",
        "Daily Goal": "Mục tiêu hàng ngày",
        "MINUTES": "PHÚT",
        "WORDS": "TỪ",
        "Continue Learning": "Tiếp tục học",
        "See all": "Xem tất cả",
        "Resume Lesson": "Tiếp tục",
        "Gemini Suggests": "Gemini Gợi ý",
        "Pronunciation Fix": "Sửa lỗi phát âm",
        "You struggled with \"th\" sounds yesterday.": "Bạn đã gặp khó khi phát âm \"th\" hôm qua.",
        "Start": "Bắt đầu",
        "Mistake Review": "Ôn lỗi sai",
        "Review 5 grammar mistakes from writing.": "Ôn lại 5 lỗi ngữ pháp trong bài viết.",
        "Coffee Chat": "Trò Chuyện Cà Phê",
        "Simulate a casual conversation in NYC.": "Mô phỏng cuộc trò chuyện thường ngày ở New York.",
        "Learning Tools": "Công cụ học tập",
        "AI Tutor": "Gia sư AI",
        "Flashcards": "Thẻ ghi nhớ",
        "Saved": "Đã lưu",
        "Rankings": "Xếp hạng",
        "Home": "Trang chủ",
        "AI Practice": "Luyện tập AI",
        "Done": "Xong",
        "Gemini Feedback": "Nhận xét Gemini",
        "Version 2.4.0 (Build 2026)": "Phiên bản 2.4.0 (Bản dựng 2026)",
        "Neutral": "Trung tính",
        "Male": "Nam",
        "Female": "Nữ",
        "Friendly": "Thân thiện",
        "Strict": "Nghiêm khắc",
        "Professional": "Chuyên nghiệp",
        "Browser Native": "Giọng trình duyệt",
        "AI High Quality": "AI chất lượng cao"
      };

      const REGEX = [
        [/^(\d+)m ago$/, (m) => `${m[1]} phút trước`],
        [/^(\d+)h ago$/, (m) => `${m[1]} giờ trước`],
        [/^(\d+)d ago$/, (m) => `${m[1]} ngày trước`],
        [/^Just now$/, () => "Vừa xong"]
      ];

      function translateNode(node) {
        const raw = node.nodeValue;
        const trimmed = raw.trim();
        if (!trimmed) return;
        if (Object.prototype.hasOwnProperty.call(EXACT, trimmed)) {
          if (trimmed === EXACT[trimmed]) return;
          node.nodeValue = raw.replace(trimmed, EXACT[trimmed]);
          return;
        }
        for (const [re, fn] of REGEX) {
          const m = trimmed.match(re);
          if (m) {
            node.nodeValue = raw.replace(trimmed, fn(m));
            return;
          }
        }
      }

      function translateAll() {
        const root = document.getElementById("root");
        if (!root) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let n;
        while ((n = walker.nextNode())) translateNode(n);
      }

      let handle = null;
      function schedule() {
        clearTimeout(handle);
        handle = setTimeout(translateAll, 120);
      }

      const root = document.getElementById("root");
      new MutationObserver(schedule).observe(root || document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
      schedule();
    })();
  </script>
