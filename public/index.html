<!doctype html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học Tiếng Anh cùng Gemini</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Dh9l9Bsl.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-TOnAb83y.css">
  <style>
    /*
      Swaps the compiled bundle's hardcoded Manrope for Be Vietnam Pro
      everywhere. The bundle's CSS bakes `font-family:Manrope,sans-serif`
      into a utility class (verified in index-TOnAb83y.css) — no source to
      change that at the root, so this overrides it globally instead.
    */
    *, body {
      font-family: "Be Vietnam Pro", "Noto Sans", sans-serif !important;
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined" !important;
    }
    /*
      The floating "AI Chat" button centered above the bottom nav is a
      purple/indigo rounded-square in the compiled bundle — clashes with the
      rest of the app's teal/orange palette. Scoped to its exact (unique)
      combination of utility classes, verified via devtools. Circle shape +
      teal gradient matching the header/streak color instead.
    */
    button.bg-gradient-to-br.from-indigo-500.via-indigo-600.to-purple-600 {
      border-radius: 50% !important;
      background: linear-gradient(135deg, #14b8a6, #0f3d38) !important;
      box-shadow: 0 8px 20px rgba(15, 61, 56, 0.35) !important;
    }
    /*
      The compiled bundle hard-codes a phone-frame mockup: a single
      `.max-w-md` wrapper (448px, plus a decorative border+shadow) that the
      whole app and its bottom nav are centered inside, regardless of
      viewport. There's no source to edit that constraint properly, so this
      widens it responsively on larger screens instead. Scoped to `.max-w-md`
      specifically because it's used for exactly these two layout anchors in
      this app (verified via devtools), not for cards/buttons elsewhere.
    */
    @media (min-width: 768px) {
      .max-w-md {
        max-width: 720px !important;
      }
      div.max-w-md.border-x {
        border: none !important;
        box-shadow: none !important;
      }
    }
    @media (min-width: 1200px) {
      .max-w-md {
        max-width: 880px !important;
      }
    }

    /*
      Desktop sidebar. The bottom tab bar is a compiled component we can't
      edit — its outer wrapper happens to have this exact combination of
      utility classes (verified via devtools), which is unique to it, so
      it's used as the hide target instead of a class we'd have to add
      ourselves. #app-sidebar below is a plain injected element (see script
      at the bottom of <body>), not part of the React tree; it does full
      page navigations (<a href>), not client-side routing, since there's no
      access to the bundle's router internals to hook into.
    */
    #app-sidebar { display: none; }
    @media (min-width: 1024px) {
      .fixed.bottom-0.left-0.right-0.z-50 { display: none !important; }
      body { padding-left: 240px; }
      #app-sidebar {
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 240px;
        padding: 24px 12px;
        background: #0f3d38;
        box-sizing: border-box;
      }
      #app-sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: none;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 600;
        font-size: 14px;
      }
      #app-sidebar a:hover { background: rgba(255, 255, 255, 0.08); }
      #app-sidebar a.active { background: rgba(255, 255, 255, 0.14); color: #fff; }
      #app-sidebar a .material-symbols-outlined { font-size: 20px; }
      #app-sidebar .sidebar-title {
        color: #fff;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 800;
        font-size: 16px;
        padding: 8px 14px 20px;
      }
    }
  </style>
</head>

<body>
  <nav id="app-sidebar">
    <div class="sidebar-title">Học Tiếng Anh cùng Gemini</div>
    <a href="/" data-path="/"><span class="material-symbols-outlined">home</span>Home</a>
    <a href="/lessons" data-path="/lessons"><span class="material-symbols-outlined">book_2</span>Học</a>
    <a href="/chat" data-path="/chat"><span class="material-symbols-outlined">smart_toy</span>AI Chat</a>
    <a href="/history" data-path="/history"><span class="material-symbols-outlined">history</span>Lịch sử</a>
    <a href="/profile" data-path="/profile"><span class="material-symbols-outlined">person</span>Hồ sơ</a>
  </nav>
  <div id="root"></div>
  <script>
    document.querySelectorAll("#app-sidebar a[data-path]").forEach((link) => {
      if (link.dataset.path === location.pathname) link.classList.add("active");
    });

    /*
      The lesson list/cards render from real data but have no click handler
      at all in the compiled bundle (verified via devtools — clicking does
      nothing, not even a failed navigation). No source to add one, so this
      patches it in from outside: fetch the real lesson list once, then map
      clicks to lesson.html by matching text ("Tiếp tục" button -> whichever
      lesson is_active) or DOM position (each row under the "Lộ trình cơ bản"
      heading, in the same order /api/lessons returns them in).
    */
    (function () {
      const lessonsPromise = fetch("/api/lessons").then((r) => r.json()).catch(() => []);

      function roadmapRows() {
        const heading = [...document.querySelectorAll("*")].find(
          (el) => el.children.length === 0 && el.textContent.trim() === "Lộ trình cơ bản"
        );
        if (!heading) return [];
        const wrapper = [...heading.parentElement.children].find((c) => c !== heading);
        return wrapper ? [...wrapper.children] : [];
      }

      document.addEventListener(
        "click",
        async function (e) {
          const continueBtn = e.target.closest("button");
          // Text is actually "Tiếp tục" + an icon glyph name glued on with no
          // separator (e.g. "Tiếp tụcarrow_forward") — startsWith, not ===.
          if (continueBtn && continueBtn.textContent.trim().startsWith("Tiếp tục")) {
            const lessons = await lessonsPromise;
            const target = lessons.find((l) => l.is_active) || lessons[0];
            if (target) location.href = `/lesson.html?id=${target.id}`;
            return;
          }

          const rows = roadmapRows();
          const idx = rows.findIndex((r) => r === e.target || r.contains(e.target));
          if (idx !== -1) {
            const lessons = await lessonsPromise;
            const lesson = lessons[idx];
            if (lesson && !lesson.is_locked) location.href = `/lesson.html?id=${lesson.id}`;
            return;
          }

          // "Sửa lỗi viết" suggestion card: same situation, no handler at
          // all. Genuinely no route existed for it anywhere (checked the
          // bundle), so writing.html + /api/writing/review were built fresh
          // rather than patched from existing data like the lesson pages.
          const writingCard = [...document.querySelectorAll("*")].find(
            (el) => el.children.length === 0 && el.textContent.trim() === "Sửa lỗi viết"
          );
          if (writingCard && (e.target === writingCard || writingCard.contains(e.target) || e.target.contains(writingCard))) {
            location.href = "/writing.html";
            return;
          }

          // Bottom nav "Lịch sử" (mobile) does client-side SPA routing to its
          // own compiled mock history page — no network request, so the new
          // real history.html (served at the clean URL /history) never gets
          // a chance to load unless we force a full navigation here instead.
          const historyNavBtn = e.target.closest("button");
          if (historyNavBtn && historyNavBtn.textContent.trim().endsWith("Lịch sử")) {
            e.preventDefault();
            e.stopPropagation();
            location.href = "/history";
            return;
          }

          // "See all" next to "Continue Learning" on Home has no handler
          // either. That heading + this button are hardcoded English in the
          // bundle regardless of the language setting (unlike the rest of
          // the app, which is Vietnamese) — verified via devtools, not a
          // translation quirk. Only wired on "/" — the same-labelled button
          // next to "Gợi ý cho bạn" on /lessons already shows everything it
          // has (just 2 cards), so there's nothing meaningful to navigate to
          // there.
          if (location.pathname === "/") {
            const seeAllBtn = e.target.closest("button");
            if (seeAllBtn && seeAllBtn.textContent.trim() === "See all") {
              location.href = "/lessons";
              return;
            }

            // "Gemini Suggests" (Pronunciation Fix / Mistake Review / Coffee
            // Chat) and "Learning Tools" (AI Tutor / Flashcards / Saved /
            // Rankings) — none of these had any handler in the compiled
            // bundle (verified via devtools). Mistake Review has real data
            // behind it (chat corrections) so it gets its own page; the
            // other two "Gemini Suggests" cards map to the existing AI Chat
            // feature since that's genuinely what practicing pronunciation
            // or a casual conversation means here — there's no separate
            // pronunciation-scoring or scenario-roleplay backend.
            const toolBtn = e.target.closest("button");
            if (toolBtn) {
              const toolText = toolBtn.textContent.trim();
              if (toolText.endsWith("AI Tutor")) {
                location.href = "/chat";
                return;
              }
              if (toolText.endsWith("Flashcards")) {
                location.href = "/flashcards.html";
                return;
              }
              if (toolText.endsWith("Saved")) {
                location.href = "/saved.html";
                return;
              }
              if (toolText.endsWith("Rankings")) {
                location.href = "/rankings.html";
                return;
              }
              if (toolText.startsWith("Start")) {
                // Walk up and stop at the FIRST ancestor whose text mentions
                // any of the 3 cards, not just "Mistake Review" — the cards
                // share a container a few levels up, so scanning past that
                // point falsely matched Mistake Review for every card.
                let ancestor = toolBtn.parentElement;
                let cardName = null;
                for (let depth = 0; depth < 6 && ancestor; depth++) {
                  const t = ancestor.textContent;
                  if (t.includes("Mistake Review")) { cardName = "mistake"; break; }
                  if (t.includes("Pronunciation Fix")) { cardName = "other"; break; }
                  if (t.includes("Coffee Chat")) { cardName = "other"; break; }
                  ancestor = ancestor.parentElement;
                }
                location.href = cardName === "mistake" ? "/mistakes.html" : "/chat";
                return;
              }
            }
          }

          if (location.pathname === "/profile") {
            const btn = e.target.closest("button");
            if (!btn) return;
            const text = btn.textContent.trim();

            // Gear icon in the header opens nothing at all (verified via
            // devtools — no modal, no navigation, completely inert). It
            // duplicates "Cài đặt & Tùy chọn" below anyway, so instead of
            // leaving it dead, scroll down to that section.
            if (text === "settings") {
              const settingsHeading = [...document.querySelectorAll("*")].find(
                (el) => el.children.length === 0 && el.textContent.trim() === "Cài đặt & Tùy chọn"
              );
              if (settingsHeading) settingsHeading.scrollIntoView({ behavior: "smooth", block: "start" });
              return;
            }

            // "Trợ giúp & Phản hồi" opens a modal that the bundle renders
            // completely empty (verified via devtools — the sheet slides up
            // with zero content inside). No source to fix that, so this
            // intercepts the click before React's own handler and goes to a
            // real page instead (FAQ + a feedback form wired to a new
            // /api/feedback endpoint).
            if (text.includes("Trợ giúp & Phản hồi")) {
              e.preventDefault();
              e.stopPropagation();
              location.href = "/help.html";
            }
          }
        },
        true
      );
    })();

    /*
      Category tabs on /lessons are decorative too: they never toggle active
      state or filter anything in the compiled bundle. Patched from outside
      like the click handler above.

      No real data to filter by — the `lessons` table has no category
      column, only title/subtitle/progress/lock flags — so "Ngữ pháp" and
      "AI Practice" show an honest empty state rather than a fake filter,
      since none of the 4 seed lessons are actually grammar drills or
      AI-practice content (those are separate cards/routes). "Từ vựng" shows
      everything, since every current lesson genuinely is a vocab topic.

      The search input next to these tabs was tried too (removing its
      hardcoded `readonly` + filtering on `input`), but React reverts both
      the attribute and the value on the native `input` event since it's a
      controlled input with no onChange handler — that's React's own
      behavior, not fixable by patching from outside. Left as decorative.
    */
    (function () {
      const lessonsPromise = fetch("/api/lessons").then((r) => r.json()).catch(() => []);

      function roadmapRows() {
        const heading = [...document.querySelectorAll("*")].find(
          (el) => el.children.length === 0 && el.textContent.trim() === "Lộ trình cơ bản"
        );
        if (!heading) return [];
        const wrapper = [...heading.parentElement.children].find((c) => c !== heading);
        return wrapper ? [...wrapper.children] : [];
      }

      const TAB_DEFS = [
        { match: "Tất cả", mode: "all" },
        { match: "Ngữ pháp", mode: "none" },
        { match: "Từ vựng", mode: "all" },
        { match: "AI Practice", mode: "none" }
      ];
      const ACTIVE_CLASS =
        "flex items-center gap-2 px-5 py-2 bg-primary text-white rounded-full shadow-md shadow-primary/20 text-sm font-bold transition-all active:scale-95";
      let currentMode = "all";

      function findTabButton(def) {
        return [...document.querySelectorAll("button")].find((b) => b.textContent.includes(def.match));
      }

      function setActiveTab(selectedBtn) {
        TAB_DEFS.forEach((def) => {
          const btn = findTabButton(def);
          if (!btn) return;
          if (btn === selectedBtn) {
            if (!btn.dataset.originalClass) btn.dataset.originalClass = btn.className;
            btn.className = ACTIVE_CLASS;
          } else if (btn.dataset.originalClass) {
            btn.className = btn.dataset.originalClass;
          }
        });
      }

      function renderEmptyState(rows) {
        const wrapper = rows[0] && rows[0].parentElement;
        if (!wrapper) return;
        let el = document.getElementById("patched-empty-state");
        const visible = rows.some((r) => r.style.display !== "none");
        if (visible) {
          if (el) el.style.display = "none";
          return;
        }
        if (!el) {
          el = document.createElement("div");
          el.id = "patched-empty-state";
          el.style.padding = "24px 4px";
          el.style.textAlign = "center";
          el.style.color = "#6b7a78";
          el.style.fontFamily = "Be Vietnam Pro, sans-serif";
          el.style.fontSize = "14px";
          wrapper.appendChild(el);
        }
        el.textContent = "Chưa có bài học nào trong mục này.";
        el.style.display = "";
      }

      function applyFilter() {
        const rows = roadmapRows();
        if (!rows.length) return;
        rows.forEach((row) => {
          row.style.display = currentMode === "all" ? "" : "none";
        });
        renderEmptyState(rows);
      }

      document.addEventListener("click", function (e) {
        const hit = TAB_DEFS.map((def) => ({ def, btn: findTabButton(def) })).find(
          ({ btn }) => btn && (btn === e.target || btn.contains(e.target))
        );
        if (!hit) return;
        currentMode = hit.def.mode;
        setActiveTab(hit.btn);
        applyFilter();
      });
    })();
  </script>
</body>

</html>
